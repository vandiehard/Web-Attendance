services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: attendance
      MYSQL_USER: attendance
      MYSQL_PASSWORD: attendance
      TZ: UTC
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uattendance", "-pattendance"]
      interval: 5s
      timeout: 5s
      retries: 20
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: attendance_test
      MYSQL_USER: attendance
      MYSQL_PASSWORD: attendance
      TZ: UTC
    ports:
      - "3307:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    profiles: ["test"]
